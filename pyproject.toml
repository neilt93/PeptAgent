[project]
name = "peptagent"
version = "0.1.0"
description = "LLM-orchestrated autonomous therapeutic peptide design with reliability estimation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Neil T."},
]

dependencies = [
    "torch>=2.1",
    "transformers>=4.36",
    "fair-esm>=2.0",
    "openai>=1.10",
    "anthropic>=0.18",
    "omegaconf>=2.3",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "biopython>=1.83",
    "meeko>=0.5",
    "vina>=1.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "ipykernel"]

[project.scripts]
peptagent = "scripts.run_agent:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
